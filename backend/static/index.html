<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireMeAI | AI Candidate Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0f111a;
            --chat-bg: #1a1d29;
            --user-msg: #3b82f6;
            --ai-msg: #2d3748;
            --text-color: #f8fafc;
            --border-color: #334155;
            --accent: #60a5fa;
            --font-family: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            display: flex;
            height: 100vh;
            flex-direction: column;
        }

        header {
            background-color: var(--chat-bg);
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .header-subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-top: 0.25rem;
        }

        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .message {
            display: flex;
            max-width: 80%;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
        }

        .message.ai {
            align-self: flex-start;
        }

        .message-content {
            padding: 1rem 1.25rem;
            border-radius: 1rem;
            font-size: 0.95rem;
        }

        .user .message-content {
            background-color: var(--user-msg);
            color: white;
            border-bottom-right-radius: 0.25rem;
        }

        .ai .message-content {
            background-color: var(--ai-msg);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 0.25rem;
        }
        
        .message-content table {
            border-collapse: collapse;
            margin: 10px 0;
            width: 100%;
            font-size: 0.9rem;
        }
        .message-content th, .message-content td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
        }
        .message-content th {
            background-color: rgba(255, 255, 255, 0.05);
            font-weight: 600;
        }
        .message-content p {
            margin: 0 0 8px 0;
        }
        .message-content p:last-child {
            margin: 0;
        }
        .message-content strong {
            color: var(--accent);
        }

        .input-container {
            padding: 1.5rem 2rem;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
        }

        .input-wrapper {
            max-width: 800px;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 1rem 3.5rem 1rem 1.5rem;
            background-color: var(--chat-bg);
            border: 1px solid var(--border-color);
            border-radius: 2rem;
            color: var(--text-color);
            font-family: var(--font-family);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.2);
        }

        button {
            position: absolute;
            right: 0.5rem;
            background-color: var(--user-msg);
            color: white;
            border: none;
            border-radius: 50%;
            width: 2.5rem;
            height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .sync-btn {
            position: static;
            width: auto;
            height: auto;
            border-radius: 0.5rem;
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            font-weight: 500;
            background-color: var(--border-color);
            color: var(--text-color);
        }

        .sync-btn:hover {
            background-color: #475569;
        }

        button:hover {
            background-color: #2563eb;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        .loading-dots {
            display: inline-block;
        }

        .loading-dots::after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { color: rgba(0,0,0,0); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            40% { color: white; text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            60% { text-shadow: .25em 0 0 white, .5em 0 0 rgba(0,0,0,0); }
            80%, 100% { text-shadow: .25em 0 0 white, .5em 0 0 white; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <div class="header-title">HireMeAI</div>
            <div class="header-subtitle">Interactive AI Candidate Interview</div>
        </div>
        <div style="font-size: 0.85rem; color: #64748b; display: flex; align-items: center; gap: 1rem;">
            <button id="sync-btn" class="sync-btn">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                Sync Latest Resume
            </button>
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <span style="display: inline-block; width: 8px; height: 8px; background-color: #10b981; border-radius: 50%;"></span>
                System Online
            </div>
        </div>
    </header>

    <div class="chat-container" id="chat-container">
        <div class="message ai">
            <div class="message-content">
                Hello! I am the AI representation of this candidate. I have fully ingested their resume and professional experience. What would you like to know about their background, skills, or projects?
            </div>
        </div>
    </div>

    <div class="input-container">
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="Ask about technical skills, experience, projects..." autocomplete="off">
            <button id="send-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            
            const contentDiv = document.createElement('div');
            contentDiv.classList.add('message-content');
            
            if (sender === 'ai' && text !== 'Thinking') {
                contentDiv.innerHTML = marked.parse(text);
            } else {
                contentDiv.innerText = text;
            }

            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            
            // Scroll to bottom
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            return contentDiv;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Add user message
            addMessage(text, 'user');
            userInput.value = '';
            
            // UI state
            userInput.disabled = true;
            sendBtn.disabled = true;

            // Add loading AI message
            const loadingMsg = addMessage('Thinking', 'ai');
            loadingMsg.innerHTML = 'Thinking<span class="loading-dots"></span>';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: text })
                });

                if (!response.ok) {
                    throw new Error('Server returned ' + response.status);
                }

                const data = await response.json();
                
                // Replace loading text with parsed markdown answer
                loadingMsg.innerHTML = marked.parse(data.answer);
                
            } catch (error) {
                console.error('Error:', error);
                loadingMsg.innerText = "Sorry, I encountered an error connecting to the server. Please try again.";
                loadingMsg.style.color = "#ef4444";
            } finally {
                // Restore UI state
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        document.getElementById('sync-btn').addEventListener('click', async (e) => {
            const btn = e.target.closest('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Syncing...';
            btn.disabled = true;

            try {
                const response = await fetch('/refresh', { method: 'POST' });
                if (response.ok) {
                    addMessage('I have just fetched and read the newest version of your resume from Google Drive! What else would you like to know?', 'ai');
                } else {
                    addMessage('Failed to sync resume from Google Drive.', 'ai');
                }
            } catch (error) {
                console.error(error);
                addMessage('Error connecting to server to sync resume.', 'ai');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
